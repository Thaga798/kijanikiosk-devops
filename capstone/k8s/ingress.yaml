apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kijani-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: kijani.local
      http:
        paths:
          - path: /payments
            pathType: Prefix
            backend:
              service:
                name: kk-payments-service
                port:
                  number: 3001
